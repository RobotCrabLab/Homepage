<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 26 70 90" class="scientist">
  <style>
    .sc-line { stroke: #14303F; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
  </style>
  <!-- Body: a brown canvas work shirt with a collar, button placket and two chest pockets -->
  <path class="sc-line" d="M23 113 V91 Q23 80 34 79 L66 79 Q77 80 77 91 V113 Z" fill="#B57E40"/>
  <rect class="sc-line" x="43" y="68" width="14" height="14" rx="3" fill="#F3C9A4"/>
  <path class="sc-line" d="M38.5 78.2 L49.6 80.4 L44.8 88.6 Z" fill="#B57E40" stroke-width="2.2"/>
  <path class="sc-line" d="M61.5 78.2 L50.4 80.4 L55.2 88.6 Z" fill="#B57E40" stroke-width="2.2"/>
  <path d="M50 81 V112" stroke="#14303F" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="50" cy="95" r="1.2" fill="#14303F"/>
  <circle cx="50" cy="104" r="1.2" fill="#14303F"/>
  <!-- Left pocket -->
  <rect class="sc-line" x="31" y="93" width="13" height="11" rx="1.6" fill="#B57E40" stroke-width="2"/>
  <path class="sc-line" d="M31 93 H44 V96.5 L37.5 98.5 L31 96.5 Z" fill="#9C6A32" stroke-width="2"/>
  <!-- Right pocket: a screwdriver for the engineering, a sample bottle for the science -->
  <rect class="sc-line" x="57.5" y="86" width="4.2" height="10" rx="1.8" fill="#F2B33D" stroke-width="1.8"/>
  <rect class="sc-line" x="62.8" y="87" width="6.6" height="10.5" rx="1.8" fill="#FFFFFF" stroke-width="1.8"/>
  <rect x="63.8" y="91.4" width="4.6" height="3.6" fill="#6FB7C9"/>
  <rect class="sc-line" x="56" y="93" width="13" height="11" rx="1.6" fill="#B57E40" stroke-width="2"/>
  <path class="sc-line" d="M56 93 H69 V96.5 L62.5 98.5 L56 96.5 Z" fill="#9C6A32" stroke-width="2"/>
  <!-- Ears and head -->
  <circle class="sc-line" cx="30.6" cy="53" r="3.6" fill="#F3C9A4" stroke-width="2.2"/>
  <circle class="sc-line" cx="69.4" cy="53" r="3.6" fill="#F3C9A4" stroke-width="2.2"/>
  <circle class="sc-line" cx="50" cy="52" r="20" fill="#F3C9A4"/>
  <!-- Short hair with a little swoop at the front -->
  <path class="sc-line" d="M30.8 47 C30 36 38.5 31 50 31.2 C61.5 31 70 36 69.2 47 C67 41.5 62.5 39.5 57.5 40 C53.5 42 46.5 42.4 42 40.4 C37 40.8 33 43 30.8 47 Z" fill="#5A3B2C"/>
  <!-- Beard: a squared-off chin, with a gap for the smile -->
  <path class="sc-line" d="M30.9 56 L31.1 64.5 Q31.6 74.4 41.5 74.6 L58.5 74.6 Q68.4 74.4 68.9 64.5 L69.1 56 C65 61 59 63 50 62.6 C41 63 35 61 30.9 56 Z" fill="#5A3B2C"/>
  <path d="M45.8 67.4 q4.2 3.2 8.4 0" fill="none" stroke="#F3C9A4" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Eyes and nose -->
  <circle cx="43" cy="51.5" r="2.3" fill="#14303F"/>
  <circle cx="43.7" cy="50.8" r="0.75" fill="#FFFFFF"/>
  <circle cx="57" cy="51.5" r="2.3" fill="#14303F"/>
  <circle cx="57.7" cy="50.8" r="0.75" fill="#FFFFFF"/>
  <ellipse cx="50" cy="57" rx="2.4" ry="1.9" fill="#E2A27E"/>
</svg>
