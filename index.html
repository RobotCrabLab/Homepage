<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Site</title>
  <style>
    :root { --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --accent: #2f6f5e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --accent: #7cc4ad; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6;
    }
    main { max-width: 36rem; padding: 2rem 1.25rem; }
    h1 { font-size: 2.25rem; margin: 0 0 .5rem; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    a { color: var(--accent); }
    nav a { margin-right: 1.25rem; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, I'm Your Name.</h1>
    <p>This site is hosted on GitHub Pages. Edit index.html to make it yours.</p>
    <nav>
      <a href="https://github.com/">GitHub</a>
      <a href="mailto:you@example.com">Email</a>
    </nav>
  </main>
</body>
</html>
