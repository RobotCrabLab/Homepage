---
layout: default
body_class: home
---
<!-- A short scroll story: the stage (intro text + portrait card) stays pinned while
     the page scrolls through the scenes below it, and the card changes with each one. -->
<section class="hero scenes" data-scene="1">
  <div class="scene-stage">
  <div class="wrap hero-grid">
    <h1>I'm {{ site.author }}.</h1>
    <div class="portrait">
    <figure class="portrait-card">
      <div class="portrait-wash" aria-hidden="true"></div>
      <!-- Phones: the title and caption are drawn inside the card, behind the jelly -->
      <div class="card-title" aria-hidden="true">
        <p class="card-title-name">I'm {{ site.author }}.</p>
        <p class="scene-caption"><span class="scene-1">Bird photographer</span><span class="scene-2">Electronics technician</span><span class="scene-3">Marine scientist</span></p>
      </div>
      <button class="theme-toggle card-theme" type="button" aria-label="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="theme-label">Light mode</span>
      </button>
      <span class="card-osprey" aria-hidden="true">{% include osprey.svg %}</span>
      <span class="card-jelly" aria-hidden="true">{% include mascot.svg class="mascot-mark" %}</span>
      <img class="portrait-me" src="{{ '/assets/images/scientist.svg' | relative_url }}" alt="" width="70" height="90">
      {% include microscope.svg %}
      <span class="card-fish card-auv" aria-hidden="true" data-fixed data-straight>{% include breadboard-auv.svg %}</span>
      <span class="card-fish card-fish-2" aria-hidden="true" data-top="64">{% include breadboard-fish.svg class="fish-body" %}</span>
      <span class="card-fish card-fish-3" aria-hidden="true" data-top="80">{% include breadboard-fish.svg class="fish-body" %}</span>
    </figure>
    <!-- One caption per scene; they cross-fade as the scenes change -->
    <p class="scene-caption">
      <span class="scene-1">Bird photographer</span>
      <span class="scene-2">Electronics technician</span>
      <span class="scene-3">Marine scientist</span>
    </p>
    </div>
  </div>
  </div>
  <div class="scene-runway" aria-hidden="true"></div>
</section>

<script>
  // Scroll scenes, step by step: a small scroll moves to the next scene, and the
  // CSS animates the change: scene 1 the osprey (bird photographer), scene 2 the
  // AUV and microscope (electronics technician), scene 3 the fish and jelly (marine
  // scientist). Scrolling back to the top returns to scene 1.
  // On phones the page doesn't scroll at all: a swipe or scroll just switches scenes.
  (function () {
    var section = document.querySelector('.scenes');
    var stage = section && section.querySelector('.scene-stage');
    if (!stage) return;
    var phone = window.matchMedia('(max-width: 40rem)');
    var frame = 0, touchY = null;
    var scene = 1, lastStep = 0;
    function setScene(n) {
      scene = Math.max(1, Math.min(3, n));
      section.setAttribute('data-scene', scene);
    }
    function step(dir) {              // phones: one swipe or scroll = one scene
      var now = Date.now();
      if (now - lastStep < 700) return;
      lastStep = now; setScene(scene + dir);
    }
    function size() {
      // Pin the stage near the top; if it's taller than the screen, pin it so the card stays in view
      stage.style.top = phone.matches ? '' : Math.min(16, window.innerHeight - stage.offsetHeight - 16) + 'px';
      update();
    }
    function update() {
      frame = 0;
      if (phone.matches) return;
      // computers: a small scroll moves to scene 2, a bit more to scene 3
      var y = window.scrollY, h = window.innerHeight;
      setScene(y < 24 ? 1 : y < h * 0.45 ? 2 : 3);
    }
    window.addEventListener('scroll', function () { if (!frame) frame = requestAnimationFrame(update); }, { passive: true });
    window.addEventListener('resize', size);
    // Phone gestures
    window.addEventListener('wheel', function (e) {
      if (!phone.matches || Math.abs(e.deltaY) < 8) return;
      step(e.deltaY > 0 ? 1 : -1);
    }, { passive: true });
    window.addEventListener('touchstart', function (e) { touchY = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchmove', function (e) {
      if (!phone.matches || touchY === null) return;
      var dy = touchY - e.touches[0].clientY;
      if (Math.abs(dy) > 30) { step(dy > 0 ? 1 : -1); touchY = null; }
    }, { passive: true });
    window.addEventListener('keydown', function (e) {
      if (!phone.matches) return;
      if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') setScene(scene + 1);
      if (e.key === 'ArrowUp' || e.key === 'PageUp') setScene(scene - 1);
    });
    size();
  })();
</script>
<script>
  // Each trip, the jelly enters from a random side about 25% up from the bottom
  // (give or take 5%) and swims up and across at about 40 degrees, bell first.
  (function () {
    var jelly = document.querySelector('.card-jelly');
    if (!jelly) return;
    var ANGLE = 40 * Math.PI / 180;   // lean from straight up
    function place() {
      var card = jelly.parentNode;
      var W = card.clientWidth, H = card.clientHeight;
      var w = jelly.offsetWidth, h = jelly.offsetHeight;
      var fromLeft = Math.random() < 0.5;
      var startTop = H * (0.75 + (Math.random() * 0.1 - 0.05)) - h / 2;   // centered ~25% up from the bottom
      var startLeft = fromLeft ? -w : W;                                   // just outside the edge
      var dy = -(startTop + h * 1.6);                                      // until it's well past the top
      var dx = Math.abs(dy) * Math.tan(ANGLE) * (fromLeft ? 1 : -1);
      jelly.style.left = startLeft + 'px';
      jelly.style.top = startTop + 'px';
      jelly.style.setProperty('--dx', dx.toFixed(1) + 'px');
      jelly.style.setProperty('--dy', dy.toFixed(1) + 'px');
      jelly.style.setProperty('--tilt', (fromLeft ? 40 : -40) + 'deg');
    }
    place();
    jelly.addEventListener('animationiteration', function (e) { if (e.target === jelly) place(); });
  })();
</script>
<script>
  // Fish swim right to left through the portrait frame. Each time a fish
  // starts a new lap (just off the right edge), it picks a new height within
  // 10% of the card above or below its usual spot (5% for the AUV). Now and then one fish at
  // a time swims in on a gentle 5-10 degree slant, up or down. The AUV
  // always cruises straight across.
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var slanted = null;
    document.querySelectorAll('.card-fish').forEach(function (fish) {
      var base = parseFloat(fish.dataset.top);
      var jitter = parseFloat(fish.dataset.jitter || 10);
      function lap() {
        var card = fish.parentNode;
        var widthPct = fish.offsetWidth / card.offsetWidth * 100;
        var heightPct = fish.offsetHeight / card.offsetHeight * 100;
        if (slanted === fish) slanted = null;
        var angle = 0;
        if (!slanted && !('straight' in fish.dataset) && Math.random() < 0.5) {
          slanted = fish;
          angle = (5 + Math.random() * 5) * (Math.random() < 0.5 ? -1 : 1);  // negative = swimming upward
        }
        // vertical drift over the whole crossing, as a share of card width (cqw) and of card height
        var riseW = Math.tan(angle * Math.PI / 180) * (100 + widthPct);
        var riseH = riseW * card.offsetWidth / card.offsetHeight;
        fish.style.setProperty('--rise', riseW.toFixed(2) + 'cqw');
        fish.style.setProperty('--tilt', (-angle).toFixed(1) + 'deg');  // nose follows the path
        // keep the whole path inside the frame
        var lo = Math.max(2, -riseH), hi = Math.min(100 - heightPct, 100 - heightPct - riseH);
        var top = base + (Math.random() * 2 - 1) * jitter;
        if (!('fixed' in fish.dataset)) fish.style.top = Math.max(lo, Math.min(hi, top)) + '%';
      }
      lap();
      // start each fish somewhere along its lap so they don't arrive together
      var dur = parseFloat(getComputedStyle(fish).animationDuration) || 13;
      fish.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's';
      fish.addEventListener('animationiteration', function (e) {
        if (e.target === fish) lap();
      });
    });
  })();
</script>
