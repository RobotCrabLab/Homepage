<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      {% include crab.svg class="crab-mark" %}
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {% assign nav = "Projects:/projects/,Blog:/blog/,Hobbies:/hobbies/,Resume:/resume/" | split: "," %}
      {% for item in nav %}
        {% assign parts = item | split: ":" %}
        {% assign href = parts[1] %}
        <a href="{{ href | relative_url }}"{% if page.url contains href %} aria-current="page"{% endif %}>{{ parts[0] }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
