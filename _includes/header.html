<header class="site-header">
  <div class="wrap header-inner">
    <!-- The logo: the Breadboard Bay sign with the little jelly in front of its corner.
         On computers it links home; on phones the same logo opens the menu. -->
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
      <span class="logo">
        <img class="logo-sign" src="{{ '/assets/images/breadboard-bay-sign.svg' | relative_url }}" alt="" width="234" height="114">
        <span class="logo-jelly">{% include mascot.svg class="mascot-mark" %}</span>
      </span>
    </button>
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="logo">
        <img class="logo-sign" src="{{ '/assets/images/breadboard-bay-sign.svg' | relative_url }}" alt="{{ site.title }}" width="234" height="114">
        <span class="logo-jelly">{% include mascot.svg class="mascot-mark" %}</span>
      </span>
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <a class="nav-home" href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
      {% assign nav = "Projects:/projects/,Blog:/blog/,Photography:/photography/,Resume:/resume/" | split: "," %}
      {% for item in nav %}
        {% assign parts = item | split: ":" %}
        {% assign href = parts[1] %}
        <a href="{{ href | relative_url }}"{% if page.url contains href %} aria-current="page"{% endif %}>{{ parts[0] }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
<script>
  (function () {
    var btn = document.querySelector('.menu-toggle');
    var nav = document.getElementById('site-nav');
    if (!btn || !nav) return;
    function setOpen(open) {
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      nav.classList.toggle('is-open', open);
    }
    btn.addEventListener('click', function () { setOpen(btn.getAttribute('aria-expanded') !== 'true'); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    nav.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
  })();
</script>
