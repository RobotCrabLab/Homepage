<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>Built by {{ site.author }}.</p>
    <ul class="links">
      {% if site.email %}<li><a href="mailto:{{ site.email }}">Email</a></li>{% endif %}
      {% if site.github_username %}<li><a href="https://github.com/{{ site.github_username }}">GitHub</a></li>{% endif %}
      {% if site.linkedin_username != "" %}<li><a href="https://www.linkedin.com/in/{{ site.linkedin_username }}">LinkedIn</a></li>{% endif %}
      {% if site.mastodon_url != "" %}<li><a rel="me" href="{{ site.mastodon_url }}">Mastodon</a></li>{% endif %}
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
    </ul>
  </div>
</footer>
