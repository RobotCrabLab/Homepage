  <g fill="#14303F"><circle cx="68" cy="120" r="1.1"/><circle cx="72" cy="122.5" r="1.1"/><circle cx="76" cy="120" r="1.1"/><circle cx="80" cy="122.5" r="1.1"/></g>
  <g class="osprey-head" transform="translate(0 -2)">
  <g class="osprey-head-turn">
  <!-- The head nods: level, tips up 7 degrees, down 5, back to level, every 5 seconds.
       An SVG animation, which Safari draws more cleanly than a CSS one. -->
