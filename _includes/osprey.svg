  <!-- Legs and talons in front of the fish, drawn as one piece: all the outlines first,
       then all the gray on top. The legs stop just above where the talons fork, so
       there's no bump in the fork. The right leg comes out from behind the body.
       Each foot has a back talon in the fish's top row of holes and a front talon one
       row lower, all in different columns (68, 72, 76, 80). -->
  <mask id="behind-body" maskUnits="userSpaceOnUse" x="0" y="0" width="140" height="160">
    <rect x="0" y="0" width="140" height="160" fill="#fff"/>
    <path transform="translate(0 -2)" d="M58 46 C44 54 42 74 46 92 C50 104 62 108 72 104 C84 98 88 80 85 60 C83 50 76 46 70 46 Z" fill="#000" stroke="#000" stroke-width="3"/>
  </mask>
