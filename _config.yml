# ---------------------------------------------------------------
# Site settings — edit these first.
# ---------------------------------------------------------------
title: Breadboard Bay
author: Chris
tagline: I build the electronics behind cutting-edge ocean engineering projects that push the limits of marine research.
description: Portfolio, resume, projects and photography from Chris, who builds scientific instruments for ocean exploration.
email: you@example.com
github_username: RobotCrabLab
# Optional: delete any line you don't use.
linkedin_username: ""
mastodon_url: ""

# The site lives at https://breadboardbay.com/ (the domain is set in the CNAME file and
# in the repository's settings; the old robotcrablab.github.io/Homepage address forwards here)
url: "https://breadboardbay.com"
baseurl: ""

# ---------------------------------------------------------------
# Build settings — you shouldn't need to touch these.
# ---------------------------------------------------------------
markdown: kramdown
permalink: /posts/:title
timezone: America/Los_Angeles

collections:
  projects:
    output: true
    permalink: /posts/:name

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values: { layout: page }
  # The picture shown when a link to any page is shared (in iMessage and the like): Chris's
  # character on a see-through background. A page can set its own `image:` to override it.
  - scope: { path: "" }
    values:
      image: { path: /assets/images/share.png, width: 1200, height: 630, alt: "Chris's character, a cartoon man with a brown beard and work shirt" }

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
